<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="hero-section">
            <div>
                <h2 id="heading-el">Metric/Imperial Unit Conversion</h2>
            </div>
            <div>
                <input type="text" id="input-el">
            </div>
            <div>
                <button id="convert-btn">Convert</button>
            </div>
        </div>
        <div class="conversion-section">
            <div class="converted-output">
                <div>
                    <h3 class="convert-header">Length (Metre/Feet)</h2>
                </div>
                <div id="length-el">
                </div>
            </div>
            <div class="converted-output">
                <div>
                    <h3 class="convert-header">Volume (Litres/Gallons)</h2>
                </div>
                <div id="volume-el">
                </div>
            </div>
            <div class="converted-output">
                <div>
                    <h3 class="convert-header">Mass (KIlograms/Pounds)</h2>
                </div>
                <div id="mass-el">
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
